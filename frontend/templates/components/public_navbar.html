<nav class="public-navbar border-b border-white/60 bg-white/80 px-4 py-2.5 backdrop-blur-xl">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4">
        <a href="/" class="brand-lockup inline-flex min-w-0 items-center gap-3 font-black">
            {% set brand_logo_context = 'navbar' %}
            {% include "components/brand_logo.html" with context %}
        </a>

        <button id="public-menu-button" class="btn-secondary px-3 py-2 text-sm md:hidden" type="button" aria-expanded="false" aria-controls="public-menu">
            <span class="sr-only">Abrir menú</span>
            ☰
        </button>

        <div id="public-menu" class="hidden items-center gap-2 md:flex">
            <a href="/olvide-password" class="rounded-lg px-3 py-2 text-sm font-bold text-dartMuted transition hover:bg-white/70 hover:text-dartText">Recuperar acceso</a>
            <a href="mailto:admin@dart-mineria.lat" class="rounded-lg px-3 py-2 text-sm font-bold text-dartMuted transition hover:bg-white/70 hover:text-dartText">Contacto</a>
            <button type="button" class="theme-toggle" data-theme-toggle aria-label="Cambiar tema"><span class="theme-toggle-knob" aria-hidden="true">◐</span></button>
            <a href="/login" class="btn-primary px-4 py-2 text-sm">Iniciar sesión</a>
        </div>
    </div>
    <div id="public-menu-mobile" class="mx-auto mt-3 hidden max-w-7xl rounded-lg border border-line bg-white p-2 shadow-lg md:hidden">
        <a href="/olvide-password" class="block rounded-lg px-3 py-2 text-sm font-bold text-dartMuted hover:bg-slate-50">Recuperar acceso</a>
        <a href="mailto:admin@dart-mineria.lat" class="block rounded-lg px-3 py-2 text-sm font-bold text-dartMuted hover:bg-slate-50">Contacto</a>
        <div class="mt-2 flex items-center justify-between rounded-lg px-3 py-2 text-sm font-bold text-dartMuted">
            <span>Tema</span>
            <button type="button" class="theme-toggle" data-theme-toggle aria-label="Cambiar tema"><span class="theme-toggle-knob" aria-hidden="true">◐</span></button>
        </div>
        <a href="/login" class="mt-2 flex rounded-lg bg-techCyan px-3 py-2 text-sm font-black text-white">Iniciar sesión</a>
    </div>
</nav>
<script>
    (function () {
        const button = document.getElementById("public-menu-button");
        const menu = document.getElementById("public-menu-mobile");
        const nav = document.querySelector(".public-navbar");
        button?.addEventListener("click", () => {
            const isOpen = !menu.classList.contains("hidden");
            menu.classList.toggle("hidden", isOpen);
            button.setAttribute("aria-expanded", String(!isOpen));
        });
        const updateNav = () => nav?.classList.toggle("is-scrolled", window.scrollY > 8);
        updateNav();
        window.addEventListener("scroll", updateNav, { passive: true });
    })();
</script>
