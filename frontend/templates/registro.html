<!DOCTYPE html>
<html lang="es">
<head>

<script src="https://cdn.tailwindcss.com"></script>
</head>

      {% set brand_logo_theme = 'light' %}

      <a href="/login" class="mt-6 inline-flex w-full justify-center rounded-lg bg-[#00A7B5] px-4 py-3 font-black text-white hover:bg-[#078c99]">Iniciar sesión</a>
    </section>
  </main>
